<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purrfectly Chaotic</title>
<style>
:root{--bg:#14121a;--card:#1e1b27;--line:#2e2a3b;--text:#ece9f4;--mute:#9a94ad;--acc:#ff9f43;--acc2:#8a7dff;--ok:#4cd39a;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:20px;margin:0;flex:1}
h1 span{color:var(--acc)}
#status{color:var(--mute);font-size:13px}
button{background:var(--acc);color:#1b1206;border:0;border-radius:10px;padding:10px 22px;font:600 15px inherit;font-family:inherit;cursor:pointer}
button.alt{background:var(--acc2);color:#fff}
button:disabled{opacity:.55;cursor:default}
main{max-width:1150px;margin:0 auto;padding:24px 28px 60px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h2{margin:0 0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.kpi .v{font-size:34px;font-weight:700}
.kpi .d{font-size:13px;color:var(--mute)}
.up{color:var(--ok)}.down{color:var(--bad)}
.steps{display:flex;gap:10px;flex-wrap:wrap}
.step{padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--mute)}
.step.run{border-color:var(--acc);color:var(--acc)}
.step.ok{border-color:var(--ok);color:var(--ok)}
.step.bad{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
a{color:var(--acc2);text-decoration:none}a:hover{text-decoration:underline}
.report h3{margin:18px 0 6px;color:var(--acc);font-size:16px}
.report h3:first-child{margin-top:0}
.report p,.report li{margin:4px 0}
.report ul{padding-left:20px;margin:6px 0}
pre{background:#100e16;border-radius:10px;padding:12px;max-height:260px;overflow:auto;font-size:12px;color:var(--mute);margin:0;white-space:pre-wrap}
.vid{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}.vid video{width:270px;border-radius:12px;background:#000;aspect-ratio:9/16}.vid img{width:100%;border-radius:10px}@media(max-width:700px){.vid{grid-template-columns:1fr}}
.empty{color:var(--mute);font-size:14px}
svg text{fill:var(--mute);font-size:11px}
@media(max-width:700px){.kpis{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1>🐱 Purrfectly <span>Chaotic</span></h1>
  <div id="status"></div>
  <button id="make" class="alt">🎬 Make Video</button>
  <button id="run">▶ Run</button>
</header>
<main>
  <div class="card" id="videocard" style="display:none"><h2 id="vidtitle">Latest video</h2><div class="vid"><video id="vid" controls preload="metadata"></video><div><img id="vsheet" alt="Preview frames"><div class="empty" id="vmeta" style="margin-top:8px"></div></div></div></div>
  <div class="card"><h2>Run progress</h2><div class="steps" id="steps"></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>Subscribers over time</h2><div id="chart"></div></div>
  <div class="card"><h2 id="reptitle">Latest report</h2><div class="report" id="report"></div></div>
  <div class="card"><h2 id="restitle">Top cat Shorts (research)</h2><div id="research"></div></div>
  <div class="card"><h2>Run log</h2><pre id="log">Nothing yet.</pre></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = s => { s = String(s||"").trim().toUpperCase(); const m = s.match(/^([\d.,]+)\s*([KMB]?)$/); if(!m) return NaN;
  return parseFloat(m[1].replace(/,/g,"")) * ({K:1e3,M:1e6,B:1e9}[m[2]]||1); };
const fmt = n => n>=1e6 ? (n/1e6).toFixed(1)+"M" : n>=1e4 ? (n/1e3).toFixed(0)+"K" : n.toLocaleString();
const STEPS_DAILY = ["Channel stats","Market research","Report"];
const STEPS_MAKE = ["Find clips","Pick and plan","Render video"];
let STEPS = STEPS_DAILY;

function md(t){
  let h = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for (const raw of t.split("\n")) {
    const l = raw.trimEnd();
    const li = l.match(/^\s*[-*]\s+(.*)/);
    if (li) { if(!inList){h+="<ul>";inList=true;} h+="<li>"+inline(li[1])+"</li>"; continue; }
    if (inList){h+="</ul>";inList=false;}
    if (/^#{1,3}\s/.test(l)) h += "<h3>"+inline(l.replace(/^#+\s*/,""))+"</h3>";
    else if (l) h += "<p>"+inline(l)+"</p>";
  }
  return h + (inList?"</ul>":"");
}

let shownVideo = null;
function video(v){
  $("videocard").style.display = v ? "" : "none";
  if (!v || shownVideo === v.video) return;
  shownVideo = v.video;
  const el = $("vid"); el.src = v.video; if (v.thumb) el.poster = v.thumb;
  $("vsheet").src = v.sheet || ""; $("vsheet").style.display = v.sheet ? "" : "none";
  $("vidtitle").textContent = "Latest video · " + v.name.replace("top5_cats_", "");
  $("vmeta").textContent = "Not uploaded. File: output\\" + v.name + ".mp4";
}

function kpis(stats){
  const defs = [["Subscribers","subscribers"],["Views (28 days)","views_28d"],["Watch hours (28 days)","watch_hours_28d"]];
  if(!stats.length){ $("kpis").innerHTML = '<div class="card empty" style="grid-column:1/-1">No stats yet. Press Run.</div>'; return; }
  const last = stats[stats.length-1], prev = stats[stats.length-2];
  $("kpis").innerHTML = defs.map(([label,k])=>{
    const v = num(last[k]); let d = "first data point";
    if (prev){ const diff = v - num(prev[k]); d = isNaN(diff) ? "" : (diff>0?`<span class="up">▲ ${fmt(diff)}</span>`:diff<0?`<span class="down">▼ ${fmt(-diff)}</span>`:"no change") + " vs "+esc(prev.date); }
    return `<div class="card kpi"><h2>${label}</h2><div class="v">${isNaN(v)?esc(last[k]||"–"):fmt(v)}</div><div class="d">${d}</div></div>`;
  }).join("");
}

function chart(stats){
  const pts = stats.map(r=>({d:r.date,v:num(r.subscribers)})).filter(p=>!isNaN(p.v));
  if(!pts.length){ $("chart").innerHTML='<div class="empty">No data yet.</div>'; return; }
  const W=1000,H=220,P=36, min=Math.min(...pts.map(p=>p.v)), max=Math.max(...pts.map(p=>p.v));
  const lo = Math.max(0, min-(max-min||5)*0.3), hi = max+(max-min||5)*0.3;
  const x = i => P + (pts.length===1 ? (W-2*P)/2 : i*(W-2*P)/(pts.length-1));
  const y = v => H-P - (v-lo)/(hi-lo)*(H-2*P);
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.v)}`).join(" ");
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Subscribers over time">`;
  for(let g=0; g<=3; g++){ const v=lo+(hi-lo)*g/3, yy=y(v); s+=`<line x1="${P}" x2="${W-P}" y1="${yy}" y2="${yy}" stroke="#2e2a3b"/><text x="${P-6}" y="${yy+4}" text-anchor="end">${Math.round(v)}</text>`; }
  s += `<path d="${line}" fill="none" stroke="#ff9f43" stroke-width="3"/>`;
  pts.forEach((p,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="#ff9f43"><title>${esc(p.d)}: ${p.v}</title></circle>`;
    if(pts.length<=10 || i%Math.ceil(pts.length/8)===0) s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(p.d.slice(5))}</text>`; });
  $("chart").innerHTML = s + "</svg>";
}

function research(rows, date){
  $("restitle").textContent = "Top cat Shorts (research)" + (date ? " · "+date : "");
  if(!rows.length){ $("research").innerHTML='<div class="empty">No research yet. Press Run.</div>'; return; }
  $("research").innerHTML = `<table><tr><th>Title</th><th>Channel</th><th class="n">Views</th><th class="n">Length</th><th>Posted</th><th>Tags</th></tr>` +
    rows.map(r=>`<tr><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc((r.title||"").slice(0,70))}</a></td><td>${esc(r.author)}</td>
    <td class="n">${fmt(r.views)}</td><td class="n">${r.seconds}s</td><td>${esc((r.published||"").slice(0,10))}</td>
    <td>${esc((r.tags||[]).slice(0,4).join(", "))||"–"}</td></tr>`).join("") + "</table>";
}

function run(r){
  STEPS = r.kind === "make" ? STEPS_MAKE : STEPS_DAILY;
  const log = r.log || [];
  const cur = {}; let active = null;
  log.forEach(l=>{ const m=l.match(/^=== (.+) ===$/); if(m && STEPS.includes(m[1])) { active=m[1]; cur[active]="run"; }});
  const sum = {}; log.forEach(l=>{ const m=l.match(/^(OK|FAILED)\s+(.+)$/); if(m) sum[m[2].trim()]=m[1]==="OK"?"ok":"bad"; });
  $("steps").innerHTML = STEPS.map(s=>{
    let st = sum[s] || (r.running && cur[s] ? "run" : "");
    // subprocess steps run sequentially; steps before the active one are done unless summary says otherwise
    if(r.running && active && !sum[s] && STEPS.indexOf(s) < STEPS.indexOf(active)) st = "ok";
    const icon = st==="ok"?"✓ ":st==="bad"?"✗ ":st==="run"?"… ":"";
    return `<div class="step ${st}">${icon}${s}</div>`; }).join("");
  $("log").textContent = log.length ? log.join("\n") : "Nothing yet.";
  if (r.running) $("log").scrollTop = $("log").scrollHeight;
  const b = $("run"), mk = $("make"); b.disabled = mk.disabled = !!r.running;
  b.textContent = r.running && r.kind !== "make" ? "Running…" : "▶ Run";
  mk.textContent = r.running && r.kind === "make" ? "Making…" : "🎬 Make Video";
  $("status").textContent = r.running ? (r.kind === "make" ? "Making a video, Chrome opens for clip search" : "Working, Chrome may open for a moment") :
    r.ended ? (r.ok ? "Last run finished OK" : "Last run had a problem, see log") + " · " + new Date(r.ended*1000).toLocaleTimeString() : "Ready";
}

let wasRunning = false, timer = null;
async function load(){
  try {
    const d = await (await fetch("/api/data")).json();
    video(d.video); kpis(d.stats); chart(d.stats); research(d.research, d.research_date); run(d.run);
    $("reptitle").textContent = "Latest report" + (d.report_date ? " · "+d.report_date : "");
    $("report").innerHTML = d.report ? md(d.report) : '<div class="empty">No report yet. Press Run.</div>';
    wasRunning = d.run.running;
    clearTimeout(timer); timer = setTimeout(load, d.run.running ? 1500 : 8000);
  } catch(e) { $("status").textContent = "Can't reach the app server"; timer = setTimeout(load, 4000); }
}
$("make").onclick = async () => { $("make").disabled = true; await fetch("/api/make",{method:"POST"}); load(); };
$("run").onclick = async () => { $("run").disabled = true; await fetch("/api/run",{method:"POST"}); load(); };
load();
</script>
</body>
</html>
